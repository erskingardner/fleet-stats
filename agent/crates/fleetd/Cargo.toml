[package]
name = "fleetd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight cross-platform system telemetry agent for FleetStats"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1", "query"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4"] }
